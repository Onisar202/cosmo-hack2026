[project]
name = "vkd-risk-service"
version = "0.1.0"
description = "Сервис прогнозирования внешних рисков и планирования ВКД на МКС"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sgp4>=2.27",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017: .ai/main-prompt.md §1 предписывает именно `datetime.now(timezone.utc)`.
ignore = ["UP017"]

[tool.mypy]
python_version = "3.11"
strict = true

# sgp4 не публикует типовые заглушки (py.typed) — .ai/backend-prompt.md §9
# требует проверку типов без ошибок, а не подавление всего модуля.
[[tool.mypy.overrides]]
module = "sgp4.*"
ignore_missing_imports = true
