      живой ответ этого эндпоинта не был получен и не проверен в этой
      сессии; парсер реализован по публично документированному, стабильному
      текстовому формату продукта (тот же стиль заголовка, что и у уже
      подтверждённого noaa-swpc-forecast-discussion-archive).
    enabled: true
    implementation_note: >-
      Парсинг, нормализация и production-шлюз fetch_and_store (TTL,
      повторы, 429, заморозка/отключение) — src/sources/noaa_3day_forecast.py.
      Интерпретация для окна ВКД — src/domain/spaceweather/external_forecast.py.
