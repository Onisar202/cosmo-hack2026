    network:
      connect_timeout_seconds: 5.0
      read_timeout_seconds: 15.0
      max_retries: 3
      retry_backoff_base_seconds: 1.0
    archive_cache: >-
      Архивный ответ не меняется — кеш бессрочен (main-prompt.md §5), в
      отличие от TTL-обновления noaa-swpc-proton-flux выше. FN-41 реализует
