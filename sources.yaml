# Реестр источников исходных данных — единственный источник истины о том,
# откуда берётся каждая величина расчёта (.ai/main-prompt.md §7,
# .ai/docs-prompt.md §4). Читается рантаймом (src/domain/mmod) и
# документацией (docs/mechanisms.md).
#
# Раздел `sources:` ниже регистрирует источники параметров Механизма 2
# (MMOD) — задача FN-25 (S1-09), исследовательская часть — и, следующими
# элементами того же списка, источники орбитальных элементов станции
# (CelesTrak, Space-Track) — задача FN-24 (S1-06). Раздел `space_weather:`
# ниже него регистрирует Механизм 1 (космическая погода) — задача FN-22
# (S1-04): NOAA SWPC, поток протонов >=10 МэВ. Записи не удаляются и не
# перезаписываются, только добавляются последующими задачами
# соответствующих зон ответственности.
#
# Обязательные поля на источник — .ai/docs-prompt.md §4: source_id, name,
# url, величины и их единицы, пространственная область применимости,
# временной охват, частота обновления, наличие и формат времени публикации,
# схема версионирования, ограничения доступа, пригодность для строгого
# исторического запуска, лицензия/условия использования. Для справочных
# астрономических констант (радиант, скорость потока) понятия
# published_at/as_of в смысле §1 main-prompt.md неприменимы буквально —
# это не временной ряд наблюдений, а параметр модели, действующий на весь
# обязательный период; поле replay_eligible_for_historical_forecast
# фиксирует именно это, отдельно от record.replay_eligible контрактов.

sources:
  - source_id: imo-shower-calendar-eta-aquariids
    name: "IMO Meteor Shower Calendar / Working List of Visual Meteor Showers — эта-Аквариды (031 ETA)"
    provider: "International Meteor Organization (IMO)"
    url: "https://www.imo.net/resources/calendar/"
    quantities:
      radiant_ra: { value_epoch_2024: 337.7, unit: deg, note: "22h 30-32m; правило-списка IMO даёт околоточечное значение на дату максимума, суточный дрейф в этой задаче не применяется (см. temporal_coverage)" }
      radiant_dec: { value_epoch_2024: -1.0, unit: deg }
      geocentric_velocity: { value: 66.0, unit: km/s, range_seen: [65.4, 66.0], note: "два независимых пересказа (IMO календарь, агрегатор со ссылкой на IMO) сходятся в пределах 1%" }
      zhr_max: { value: 50, unit: "meteors/hour (ZHR)", range_seen: [50, 55], note: "разброс между годовыми календарями IMO; не является измерением конкретного года" }
      activity_period: { start: "04-19", end: "05-28", peak: "05-05..05-06", note: "широкий максимум без резкого пика, ~неделя вокруг 5 мая" }
    spatial_scope: "Геоцентрический радиант в геоцентрической ЭКВАТОРИАЛЬНОЙ системе координат (RA/Dec — прямое восхождение и склонение, НЕ гелиоцентрически-эклиптические), стандартная эпоха рабочих списков IMO/IAU MDC — J2000/ICRS. Конкретная эпоха не была независимо подтверждена в этой сессии из-за сетевых ограничений (см. access_restrictions) — перед использованием в расчёте требуется явное подтверждение эпохи по первичному источнику. Направление радианта не зависит от точки наблюдения; от геометрии станции зависят видимость радианта (экранирование Землёй, docs/mechanisms.md §5) и угол между радиантом и вектором станции. ВНИМАНИЕ реализации: RA/Dec заданы в экваториальной системе — перед вычислением угла до направления в надир (вектор станции в TEME/ECI из src/domain/orbit) радиант обязан быть явно преобразован в ту же систему координат, что и вектор станции; молчаливое смешение экваториальных RA/Dec с TEME-вектором станции даёт неверный угол экранирования (см. docs/mechanisms.md §9)."
    temporal_coverage: "Ежегодно повторяющийся поток, родительское тело — комета 1P/Галлея. Радиант смещается по небу на доли градуса в сутки и медленно (за десятилетия) из-за прецессии; для обязательного периода 01.05–30.06.2024 использовано значение на дату максимума без суточной коррекции дрейфа — это упрощение зафиксировано в docs/mechanisms.md §10 как ограничение эталонных случаев (не влияет на порядок величины угла экранирования)."
    update_frequency: "Статический справочник; IMO публикует обновлённый календарь раз в год. Выборка для этой задачи сделана 2026-09-19."
    published_at_available: false
    published_at_note: "Неприменимо буквально — справочная константа модели потока, не запись наблюдения с моментом публикации; для строгого historical_forecast используется как параметр модели, действующий на весь обязательный период, а не как record с published_at (см. main-prompt.md §1)."
    versioning: "Год выпуска календаря IMO не был доступен для точной сверки (см. access_restrictions) — использована консолидация нескольких актуальных источников, ссылающихся на IMO working list; расхождение между ними в пределах 1% (velocity) и 10% (ZHR), задокументировано выше."
    access_restrictions: "Без ключа/регистрации, публичная веб-страница. Прямая загрузка исходного PDF (imo.net) была заблокирована сетевым прокси этой сессии (EGRESS_BLOCKED) — значения взяты из нескольких независимых веб-поисковых выдержек, ссылающихся на этот источник, и перепроверены источником ниже (IAU MDC)."
    replay_eligible_for_historical_forecast: false
    replay_eligible_note: "БЛОКЕР (round-1 ревью PR #15): версия/год календаря IMO, из которого взяты эти числа, не установлена (выборка сделана веб-поиском 2026-09-19, без датированного снимка источника) — published_at относительно as_of=2024 не может быть подтверждён как <= as_of. Отметка replay_eligible=true была бы недоказанным допущением о доступности справочника в 2024 году, прямо запрещённым main-prompt.md §1 («неизвестное время публикации — это «непригодно», а не «вероятно, было доступно»»). До тех пор, пока реализация не привяжет эти параметры к конкретной датированной версии источника (год календаря <= as_of, с сохранением этой версии), они пригодны только для качественной демонстрации геометрии/скорости (как в reference-cases.json), не для strict historical_forecast."
    license: "Материалы IMO публикуются для образовательного/исследовательского использования со ссылкой на источник. Точные условия редистрибуции не были независимо проверены в этой сессии (сетевой доступ к imo.net заблокирован); при выходе за пределы хакатона требуется подтверждение лицензии на сайте IMO."
    is_duplicate_of: null
    implementation_note: "radiant_ra/radiant_dec/geocentric_velocity потребляются src/domain/mmod/geometry.py (FN-32) как явные аргументы assess_shower_geometry — модуль не хранит и не подставляет их сам. replay_eligible_for_historical_forecast остаётся false (см. выше); FN-32 не меняет это состояние."

  - source_id: iau-mdc-shower-database
    name: "IAU Meteor Data Center — методология каталога потоков (общая сверка); конкретные числа радианта/скорости эта-Аквариид — из отдельно процитированного наблюдения ниже, НЕ из этой статьи"
    provider: "IAU Meteor Data Center (Jopek & Kaňuchová) — методология; наблюдение — Egal, Brown, Wiegert, Campbell-Brown, Vida (Western University / Planétarium de Montréal)"
    url: "https://arxiv.org/abs/1607.00661"
    specific_observation_source:
      citation: "A. Egal, P. G. Brown, P. A. Wiegert, M. Campbell-Brown, D. Vida — Central Bureau Electronic Telegram (CBET) No. 5259 (2023): вспышка эта-Аквариид (IAU shower 31), зафиксированная многочастотным радаром CMOR (Tavistock, Ontario) 4-7 мая 2023 г.; максимум потока около солнечной долготы 45.4 ± 0.5°."
      url: "https://ui.adsabs.harvard.edu/abs/2023CBET.5259....1E/abstract"
      note: "Прямая загрузка текста CBET (tamkin3.eps.harvard.edu) заблокирована сетевым прокси этой сессии (EGRESS_BLOCKED); авторы/аффилиация/дата/описание подтверждены через реферат ADS (Harvard Astrophysics Data System) — это не сама текстовая телеграмма, но стабильная, датированная, цитируемая научная запись, не 'неназванная более поздняя публикация'."
    quantities:
      radiant_ra: { value: 337.70, unit: deg, note: "R.A. = 337.70°, из CBET 5259 (specific_observation_source), измерение выброса 2023 г." }
      radiant_dec: { value: -1.04, unit: deg, note: "из CBET 5259" }
      geocentric_velocity: { value: 65.64, uncertainty: 1.59, unit: km/s, note: "65.64 ± 1.59 км/с, из CBET 5259, измерение выброса 2023 г." }
    spatial_scope: "Геоцентрический радиант, геоцентрическая экваториальная система координат (RA/Dec) — та же система, что и у imo-shower-calendar-eta-aquariids; см. там же примечание о необходимом преобразовании в систему станции перед расчётом угла экранирования."
    temporal_coverage: "Радиант и геоцентрическая скорость — физически стабильные характеристики потока (не зависят от конкретного года так, как зависит интенсивность/ZHR); используются как сверка порядка величины для эта-Аквариид 2024. ВАЖНО: CBET 5259 описывает АНОМАЛЬНУЮ вспышку 2023 г. (поток мелких частиц, не резонирующий с визуальными наблюдениями) — это не 'типичный год', и его ZHR-подобные метрики потока (авторами измерены как метеороиды/1000км²/час на радаре, не как визуальный ZHR) намеренно НЕ включены в quantities выше и не смешаны со значением zhr_max=50 из imo-shower-calendar-eta-aquariids."
    update_frequency: "Научная база данных общей методологии (arXiv:1607.00661, 2016) обновляется по мере поступления новых анализов; конкретные числа радианта/скорости выше — из отдельной, точно датированной публикации CBET 5259 (2023-05), см. specific_observation_source."
    published_at_available: true
    published_at_note: "specific_observation_source опубликован в мае 2023 г. (CBET 5259) — предшествует обязательному периоду 01.05–30.06.2024, но версия/снимок для строгого replay не закреплены этой задачей (см. replay_eligible_note)."
    versioning: "Методология — arXiv:1607.00661 (2016); наблюдение радианта/скорости — CBET 5259 (2023-05), см. specific_observation_source."
    access_restrictions: "Открытый доступ к рефератам (arXiv, ADS), без ключа. Прямая загрузка первичных текстов (arxiv.org, tamkin3.eps.harvard.edu) была заблокирована сетевым прокси этой сессии (EGRESS_BLOCKED); числа подтверждены через реферат ADS и результаты веб-поиска, ссылающиеся на него, не прочитаны из оригинального текста CBET."
    replay_eligible_for_historical_forecast: false
    replay_eligible_note: "БЛОКЕР (round-1 ревью PR #15): хотя CBET 5259 датирован (2023-05, до начала обязательного периода 2024 г.), эта задача не сохраняет датированный снимок/версию записи в хранилище записей источника (нет record_id/source_version/checksum по контракту record.schema.json) — без этого 'published_at <= as_of' не проверяемо машиной и не может быть отмечено replay_eligible=true по смыслу main-prompt.md §1. Кроме того, эти конкретные числа описывают аномальную вспышку 2023 г. (temporal_coverage), а не заведомо применимую к 2024 базовую характеристику — использование для строгого 2024-прогноза требует отдельного решения зоны 2/3, не этой исследовательской задачи. Годится только как независимая сверка порядка величины радианта/скорости (§3 docs/mechanisms.md), не как record для strict replay."
    license: "arXiv preprint и реферат ADS — открытый доступ; CBET — платная подписка IAU Central Bureau на полный текст телеграмм (реферат ADS открыт, сам текст мог требовать подписки — не проверено в этой сессии из-за EGRESS_BLOCKED); предметные данные цитируются с указанием авторства (Egal et al. 2023; Jopek & Kaňuchová)."
    is_duplicate_of: null

  - source_id: cams-jenniskens-daytime-arietids
    name: "CAMS / Jenniskens — Daytime Arietids and Marsden Sunskirters (ARI, IAU #171)"
    provider: "CAMS (Cameras for Allsky Meteor Surveillance), P. Jenniskens"
    url: "http://cams.seti.org/jenniskens-ari_offprint.pdf"
    quantities:
      radiant_ra: { value_approx: 42.5, unit: deg, note: "≈02h50m, радиант дневных потоков лежит ~20-30° западнее Солнца — точное численное значение на дату максимума не подтверждено (см. limitations ниже)" }
      radiant_dec: { value_approx: 24.0, unit: deg }
      geocentric_velocity: { conflicting_values: [{ value: 49.0, unit: km/s, source_note: "V∞ по календарю IMO" }, { value: 38.0, unit: km/s, source_note: "радиолокационная оценка (агрегатор), возможно другая точка отсчёта скорости (входная vs геоцентрическая)" }], unit: km/s, resolved: false }
      zhr_max: { conflicting_values: [{ value: 50, unit: "ZHR", source_note: "обобщённый агрегатор" }, { value_range: [14, 23], unit: "ZHR", source_note: "Rendtel, Proceedings of the IMC Giron 2014 — совместный анализ радио/видео/визуальных данных, зависит от близости пика к опорной позиции" }], resolved: false }
      activity_period: { peak_solar: "λ☉≈76°, ~7 июня", note: "«сильнейший из дневных потоков»" }
    spatial_scope: "Геоцентрический радиант; наблюдается преимущественно радио/радарными методами (дневной поток — оптически почти не виден на фоне Солнца)."
    temporal_coverage: "Ежегодно повторяющийся поток, широкая активность (продолжительная, не резкий пик); предмет отдельного проекта IMO по объединению данных разных методик с 2014 г."
    update_frequency: "Статический справочник, эпизодически уточняется научными публикациями."
    published_at_available: false
    published_at_note: "Неприменимо — справочная константа модели потока."
    versioning: "Не определена однозначно в этой сессии — см. limitations."
    access_restrictions: "Прямая загрузка cams.seti.org и повторная сверка через IMO/AMS/theskylive были заблокированы сетевым прокси этой сессии (EGRESS_BLOCKED на каждом из доменов). Значения взяты из веб-поисковых выдержек с противоречащими друг другу числами."
    replay_eligible_for_historical_forecast: false
    replay_eligible_note: "БЛОКЕР: скорость (Vg) и ZHR дневных Ариетид не сошлись к единому значению из независимо найденных вторичных источников (49 vs 38 км/с; 50 vs 14–23 ZHR) и не были сверены с первичным источником (IAU MDC/IMO calendar PDF) из-за сетевых ограничений этой сессии. До разрешения расхождения абсолютная калибровка потока дневных Ариетид не должна использоваться в расчёте; допустимо использовать только для качественной геометрической демонстрации (направление радианта), не для количественной оценки уровня. См. docs/mechanisms.md §10."
    license: "Точные условия использования CAMS/Jenniskens offprint не проверены независимо в этой сессии (сеть заблокирована)."
    is_duplicate_of: null

  - source_id: sporadic-background-dynamical-model
    name: "Спорадический фон метеороидов: источники Helion/Anti-Helion, Apex, Toroidal — описательная сверка (не реализуется в этой задаче)"
    provider: "NASA Meteoroid Environment Office (MEM/MEMR2); Jones & Brown, dynamical model of sporadic sources"
    url: "https://ntrs.nasa.gov/api/citations/20170005351/downloads/20170005351.pdf"
    quantities:
      description: "Спорадический фон не изотропен: выделяются источники Helion (~342° солн. долготы), Anti-Helion (~198°), North/South Apex (~270°), North/South Toroidal. NASA MEM/MEMR2 моделирует скорость, направленность и распределение по размерам для инженерных расчётов повреждаемости КА."
    spatial_scope: "Вся небесная сфера, распределённая по нескольким источникам с разной геометрией и скоростью каждый."
    temporal_coverage: "Квазипостоянный годовой фон с медленной сезонной модуляцией по источникам."
    update_frequency: "Модель обновляется NASA MEO нерегулярно (текущая версия — MEMR2)."
    published_at_available: false
    published_at_note: "Неприменимо — модель, не временной ряд наблюдений."
    versioning: "MEMR2 (см. arXiv:1909.05947)."
    access_restrictions: "Открытый доступ к описательным публикациям (NASA NTRS, arXiv); сама модель MEM — распространяемый NASA инструмент с отдельными условиями получения, не проверенными в этой сессии."
    replay_eligible_for_historical_forecast: false
    replay_eligible_note: "БЛОКЕР/явное упрощение: полная направленная модель спорадического фона (несколько источников с разной геометрией/скоростью) в этой задаче и на этом этапе НЕ реализуется — вне объёма исследовательской части S1-09. Согласованное масштабирование, описанное в docs/mechanisms.md §7, применяется к фону как к единому эффективному источнику (упрощение), а не к каждому из четырёх источников отдельно. Это ограничение явно зафиксировано, а не скрыто (.ai/docs-prompt.md §2)."
    license: "Публикации NASA NTRS/arXiv — открытый доступ; сама модель MEM может требовать отдельного соглашения NASA (не проверено)."
    is_duplicate_of: null
    implementation_note: "БЛОКЕР подтверждён повторно в FN-32 (S2-02): числового значения фона здесь по-прежнему нет, а сетевой прокси этой сессии повторно отклонил ntrs.nasa.gov/arxiv.org (connect_rejected) при попытке проверить первичный источник перед реализацией. src/domain/mmod/geometry.py поэтому вычисляет только effective_flux_ratio (направленный поток, docs/mechanisms.md §6) и не вычисляет ratio_to_background — см. docs/mechanisms.md §11.3. ОБНОВЛЕНИЕ FN-39 (S2-08): числовая нормировка для обязательного периода 2024 реализована ДРУГОЙ, более применимой записью реестра — sporadic-background-dynamical-model (эта запись) остаётся нереализованной описательной сверкой полной направленной модели MEM/MEMR2 по источникам Helion/Apex/Toroidal, как и была; она не используется расчётом. Источник для ratio_to_background — nasa-meo-leo-forecast-2024 ниже (готовый, уже согласованно отнормированный на фон показатель NASA MEO, не эта модель)."

  - source_id: nasa-meo-leo-forecast-2024
    name: "NASA MEO — The 2024 meteor shower activity forecast for low Earth orbit (почасовые факторы повышения потока над спорадическим фоном)"
    provider: "NASA Meteoroid Environment Office (MEO), Marshall Space Flight Center — Althea Moorhead, Danielle Moser, Bill Cooke"
