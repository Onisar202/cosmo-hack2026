      UTC``), НЕ время слота из имени файла/URL: подтверждённое расхождение —
      выпуск «...0030» за 10 мая фактически выпущен в 00:35 UTC. Независимо
      подтверждено HTTP-заголовком ``Last-Modified`` — совпадает с
      ``:Issued:`` на всех проверенных ответах.
    versioning: >-
      ``ETag`` не предоставляется. Повторных версий одного слота в архиве нет
      (один файл на слот) — source_version в src/sources/archive_probe.py
      строится из ``:Issued:``, аналогично nasa-donki-notifications выше.
    quality_notes: >-
      Время публикации обязано разбираться из тела, не из имени файла или
      времени HTTP-запроса (см. published_at) — коннектор, доверяющий имени
      файла, тихо занизил бы published_at на несколько минут для части
      выпусков, что для отсечения на границе часа/минуты — реальная утечка.
      ``observed_at``/``valid_from``/``valid_to`` — точка (момент выпуска),
      не интервал: бюллетень описывает и прошедшие 24 часа, и прогноз по
      четырём темам отдельными фразами с разными датами на тему, единого
      машиночитаемого горизонта нет (round 1 ревью PR #18 — прежняя версия
      подставляла ``valid_to = issued_at + 12 часов``, что расходилось с
      реальным 2-3-суточным горизонтом текста). ``quality=reconstructed``
      по той же причине. Извлечение интервала по каждой теме отдельно —
      разбор свободного текста, зона 3.
    access_restrictions: "Без ключа/регистрации, публичный HTTP-эндпоинт NCEI."
    license: >-
      Продукт NOAA — общественное достояние (U.S. Government work); NOAA
      просит указывать атрибуцию "NOAA Space Weather Prediction Center".
    independence_note: >-
      Независима от nasa-donki-notifications выше: другой поставщик (NOAA, не
      NASA/CCMC), другой формат (текст с ``:Issued:``, не JSON с
