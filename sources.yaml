      published_at всегда известен из ':Issued:' для успешно распарсенного
      бюллетеня (см. published_at выше) — по стандартному правилу
      src/store/records.py записи этой линии пригодны для строгого replay.
      НЕ ПОДТВЕРЖДЕНО на реальном сохранённом ответе в этой сессии (см.
