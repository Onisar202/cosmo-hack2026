    quality_notes: >-
      Связанные уведомления одного явления (например CME → SEP → IPS → GST
      одной активности) поступают как отдельные messageID — main-prompt.md §4
      «связанные сигналы одного события дают один вклад» обязана
      реализовываться выше по пайплайну (домен), не здесь: этот зонд/коннектор
