      сохранённого выпуска. Пригодность ограничена периодом фактического
      покрытия архива (см. coverage выше) — пробел 15.05–16.06.2024 остаётся
      пробелом и для этого источника, ничем не восполняется: donki-notifications
      выше даёт для того же интервала независимую эпизодическую линию
      предупреждений о конкретных событиях, а не замену этому периодическому
