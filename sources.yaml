      обязательного периода — у noaa-swpc-forecast-discussion-archive
      подтверждённый пробел 15.05–16.06.2024), а не как итоговый
      архитектурный ответ: вопрос, достаточно ли DONKI без числового
      прогноза NOAA, постановкой FN-41 оставлен открытым.

