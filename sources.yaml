  # --- Орбитальные элементы станции — FN-24 (S1-06) -----------------------

  - source_id: celestrak-gp
    name: "CelesTrak GP (General Perturbations) — текущие орбитальные элементы МКС"
    provider: "CelesTrak (T.S. Kelso)"
    url: "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE"
    quantities:
