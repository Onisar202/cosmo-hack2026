# --- Механизм 1 (космическая погода) — задача FN-22 (S1-04). ---
space_weather:
  - id: noaa-swpc-proton-flux
    name: "NOAA SWPC GOES Integral Proton Flux (>=10 MeV)"
    provider: "NOAA Space Weather Prediction Center (SWPC)"
    url: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
    product: >-
      integral-protons-1-day, первичный спутник GOES ("primary"), канал
      энергии ">=10 MeV" — интегральный поток протонов с энергией выше
      10 МэВ, ровно та величина, что задаёт шкалу S NOAA (main-prompt.md
      §11, «Механизм 1. Радиационная обстановка»).
    record_kind: observation
    value_unit: pfu
    cadence: "обновляется провайдером каждые ~1–5 минут; ответ — скользящее окно 1 сутки"
    coverage: >-
      только текущие данные — этот эндпоинт не хранит архив; исторический
      период (1 мая – 30 июня 2024) этим источником не покрывается и
      обслуживается отдельной линией (см. published_at ниже).
    published_at: >-
      не предоставляется этим продуктом — в ответе есть только время
      измерения (time_tag), не время выпуска. Поэтому published_at записи
      всегда null, а replay_eligible всегда false для записей этого
      коннектора (main-prompt.md §1: неизвестное время публикации — это
      «непригодно», а не «вероятно было доступно»; §11 прямо допускает этот
      случай: «допускается отсутствие доказанной публикации текущего
      измерения: replay_eligible=false»). Строгий replay из прошлого по
      космопогоде реализуется другой линией — архивные текстовые сводки
      NOAA SWPC с отметкой Issued в архиве NOAA NCEI — вне объёма этой
      задачи (main-prompt.md §11).
    quality_notes: >-
      Записи, попавшие в интервал манёвра yaw-flip спутника GOES (поле
      ответа yaw_flip), помечаются quality=degraded — в этот период поле
      зрения датчика частиц отклонено от штатного, и измерение менее
      надёжно, хотя и не отсутствует. Отрицательное или отсутствующее
      значение потока (заведомо невалидный отсчёт продукта) сохраняется как
      value=null, а не отбрасывается и не заменяется нулём (main-prompt.md
      §2).
    license: >-
      Продукт NOAA — общественное достояние (U.S. Government work),
      специальных ограничений на локальное хранение или частоту опроса не
      опубликовано; NOAA просит указывать атрибуцию "NOAA Space Weather
      Prediction Center" при использовании данных.
    independence_note: >-
      Единственный зарегистрированный коннектор этого измерения; второй
      источник, перепечатывающий то же измерение GOES, в реестре не
      заведён (main-prompt.md §5 — это не было бы независимым
      подтверждением).
    network:
      connect_timeout_seconds: 5.0
      read_timeout_seconds: 10.0
      max_retries: 3
      retry_backoff_base_seconds: 1.0
    freshness:
      # Раз в столько секунд периодический refresh реально идёт в сеть;
      # более частые вызовы fetch_and_store — недорогой no-op (TTL по
      # публикации продукта, main-prompt.md §5).
      ttl_seconds: 300
      # Свыше этого возраста последнего успешного получения источник
      # считается критически устаревшим — по нему оценка невозможна, а не
      # «спокойно» (main-prompt.md §2, приёмка FN-22).
      critical_staleness_seconds: 3600
    enabled: true
