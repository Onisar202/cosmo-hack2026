    versioning: "source_version — ISO8601-эпоха набора элементов (src/sources/orbit.py:build_orbital_elements_record); новый набор элементов CelesTrak — это всегда новая эпоха, то есть новая версия рядом со старой (src/store/records.py), а не перезапись."
