  # --- NOAA 3-Day Forecast (S1+), обязательное изменение №1 — FN-31 (S2-01). ---
  # Отдельная от noaa-swpc-proton-flux выше линия: там — наблюдение GOES pfu,
  # здесь — суточная вероятность (%) внешнего прогноза NOAA уровня S1 и выше
  # на каждый из трёх прогнозных дней (main-prompt.md §11 «Механизм 1»,
  # абзац «Прогноз — собственный или обоснованно применённый внешний»).
  # Два раздельных id (живой продукт и архив) с ОБЩИМ парсером
  # (src/sources/noaa_3day_forecast.py::parse_noaa_3day_forecast) — формат
  # текста идентичен, различается только точка получения и то, что архивный
  # ответ не требует TTL/периодического refresh (main-prompt.md §5 «кеш
  # архивных ответов бессрочен»).

  - id: noaa-swpc-3day-forecast
    name: "NOAA SWPC 3-Day Forecast — суточная вероятность S1 и выше (Solar Radiation Storm Forecast)"
    provider: "NOAA Space Weather Prediction Center (SWPC)"
    url: "https://services.swpc.noaa.gov/text/3-day-forecast.txt"
    product: >-
      Текстовый бюллетень, обновляется NOAA раз в сутки; раздел B «NOAA
      Solar Radiation Storm Forecast» несёт таблицу с тремя прогнозными
      днями и строкой «S1 or greater» — суточной вероятностью (0-100%)
      события уровня S1 и выше. Разделы A (геомагнитная активность Kp) и C
      (радиошумовые блэкауты R) этим коннектором намеренно не извлекаются
      — main-prompt.md §11 относит Kp и шкалу R к отдельному контексту
      Механизма 1, не к этой линии.
    record_kind: forecast
    value_unit: percent
    cadence: "публикуется NOAA номинально раз в сутки (документированная частота продукта; момент суток в этой сессии не подтверждён живым запросом, см. access_restrictions)."
    coverage: >-
      Только текущий (последний выпущенный) бюллетень — этот эндпоинт не
      хранит архив; исторический период обслуживается отдельной записью
