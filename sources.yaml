        порога 10 pfu, то есть ровно порога S1 шкалы NOAA, main-prompt.md
        §11) и о геомагнитной буре (GST — модулятор жёсткости геомагнитного
        обрезания, собственного уровня не создаёт, но относится к тому же
        механизму). Именно эта пара соответствует определению контрольного
        спокойного периода 16–27 июня 2024 в main-prompt.md §11 («нет
        уведомлений DONKI о протонных событиях и геомагнитных бурях») и
        проверена по реальному архиву
        (tests/fixtures/sources/archive/README.md). Типы CME/FLR/IPS/MPC/RBE/
        Report в оценку не входят: это признаки того же явления на другом
        этапе (main-prompt.md §4 «связанные сигналы одного события дают один
        вклад»), а не отдельное воздействие на окно ВКД.
      event_persistence_lookback_hours: 24
      event_persistence_lookback_note: >-
        Обратный запас от начала окна, в пределах которого уже ОБЪЯВЛЕННОЕ
        событие считается продолжающимся: DONKI выпускает уведомление в
        момент начала события и не выпускает сообщения об окончании, поэтому
        окно сразу после такого уведомления нельзя считать спокойным.
        Предположение консервативно в сторону тревоги, не благополучия, и
        явно отмечено в notes оценки. Это НЕ горизонт собственного прогноза
        вперёд: вопрос 6 ч против 24 ч FN-41 намеренно не решает (прямо
        оставлен открытым постановкой задачи).
    replay_eligible_for_historical_forecast: true
    replay_eligible_note: >-
      Подтверждено на реальных сохранённых ответах (245 уведомлений,
      01.05–30.06.2024): у 244 из 245 два независимых указания времени
      публикации (``messageIssueTime`` и тело письма) согласуются, published_at
      известен и проверяем, поздний выпуск исключается стандартным правилом
      src/store/records.py::select_as_of. Для расходящихся случаев (1 из 245
      в проверенных данных) published_at становится ``None`` вместо
      угаданного значения — round 1 ревью PR #18, тест
      tests/sources/test_archive_publication.py::test_donki_conflicting_issue_time_fields_are_not_silently_trusted.
      Пригодность ограничена уведомлениями с извлекаемым временем события
      (~82% реального архива, см. quality_notes выше) — остальные не
      превращаются в запись этим зондом вовсе, а не помечаются пригодными
      с придуманным временем события.
    enabled: true
    implementation_note: >-
      Парсинг и нормализация в RecordInput — src/sources/archive_probe.py
      (parse_donki_notifications, donki_notification_to_record_input), FN-23.
      FN-41 (этап 3) добавил production-шлюз src/sources/donki.py
      (fetch_and_store_window): реальный HTTP через src/sources/http.py
      (раздельные таймауты, ограниченные повторы, отдельная обработка 429),
