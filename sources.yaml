    implementation_note: "Реализовано: src/sources/orbit_history.py (parse_oem, parse_s3_listing, verify_fetch_integrity, select_release_for_forecast, select_release_for_analysis, build_oem_orbital_elements_record) + src/domain/orbit/interpolate.py (interpolate_state, hermite-cubic-per-axis-v1) + src/sources/orbit.py::select_oem_elements_for_request (маршрутизация по mode). FN-33 был гейтом/пробой над сохранёнными фикстурами; FN-41 (этап 3) добавил production-шлюз ensure_releases_for_interval — реальный HTTP через src/sources/http.py, разбор индекса архива (parse_archive_index), перепроверку целостности скачанных байт против S3-листинга (verify_release_bytes: размер + ETag как MD5; сверка сохранённых HTTP-заголовков из *.meta.json остаётся только у фикстурного verify_fetch_integrity, потому что общий HTTP-клиент заголовки не отдаёт) и сохранение выпуска в хранилище. Объём шлюза — загрузка по требованию для расчётного интервала запроса (кандидаты в окне 16 суток назад / 2 суток вперёд, не более 8 выпусков за расчёт); фоновая предзагрузка всего архива и планировщик обновления по-прежнему вне объёма. quality сохранённой записи выпуска — всегда nominal (как получено): метка реконструкции — свойство ОТБОРА (historical_analysis) и живёт в result.orbit.is_reconstructed, а не в записи, иначе один и тот же выпуск, отобранный обеими ветками, конфликтовал бы по дедуп-ключу хранилища (src/sources/orbit_history.py, модульный docstring)."

# --- Механизм 1 (космическая погода) — задача FN-22 (S1-04). ---
space_weather:
  - id: noaa-swpc-proton-flux
    name: "NOAA SWPC GOES Integral Proton Flux (>=10 MeV)"
    provider: "NOAA Space Weather Prediction Center (SWPC)"
    url: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
    product: >-
      integral-protons-1-day, первичный спутник GOES ("primary"), канал
      энергии ">=10 MeV" — интегральный поток протонов с энергией выше
      10 МэВ, ровно та величина, что задаёт шкалу S NOAA (main-prompt.md
      §11, «Механизм 1. Радиационная обстановка»).
    record_kind: observation
    value_unit: pfu
    cadence: "обновляется провайдером каждые ~1–5 минут; ответ — скользящее окно 1 сутки"
    coverage: >-
      только текущие данные — этот эндпоинт не хранит архив; исторический
      период (1 мая – 30 июня 2024) этим источником не покрывается и
      обслуживается отдельной линией (см. published_at ниже).
    published_at: >-
      не предоставляется этим продуктом — в ответе есть только время
      измерения (time_tag), не время выпуска. Поэтому published_at записи
      всегда null, а replay_eligible всегда false для записей этого
      коннектора (main-prompt.md §1: неизвестное время публикации — это
      «непригодно», а не «вероятно было доступно»; §11 прямо допускает этот
      случай: «допускается отсутствие доказанной публикации текущего
      измерения: replay_eligible=false»). Строгий replay из прошлого по
      космопогоде реализуется другой линией — архивные текстовые сводки
      NOAA SWPC с отметкой Issued в архиве NOAA NCEI — вне объёма этой
      задачи (main-prompt.md §11).
    quality_notes: >-
      Записи, попавшие в интервал манёвра yaw-flip спутника GOES (поле
      ответа yaw_flip), помечаются quality=degraded — в этот период поле
      зрения датчика частиц отклонено от штатного, и измерение менее
      надёжно, хотя и не отсутствует. Отрицательное или отсутствующее
      значение потока (заведомо невалидный отсчёт продукта) сохраняется как
      value=null, а не отбрасывается и не заменяется нулём (main-prompt.md
      §2).
    license: >-
      Продукт NOAA — общественное достояние (U.S. Government work),
      специальных ограничений на локальное хранение или частоту опроса не
      опубликовано; NOAA просит указывать атрибуцию "NOAA Space Weather
      Prediction Center" при использовании данных.
    independence_note: >-
      Единственный зарегистрированный коннектор этого измерения; второй
      источник, перепечатывающий то же измерение GOES, в реестре не
      заведён (main-prompt.md §5 — это не было бы независимым
      подтверждением).
    classification: >-
      FN-38 (S2-08, src/domain/spaceweather/observed_classifier.py): уровни
      S1/S2/S3 по этому значению — шкала S NOAA, main-prompt.md §11
      «Механизм 1» (фон <10, S1>=10, S2>=100, S3>=1000 pfu), дословно, без
      подбора или калибровки этой задачей (main-prompt.md §4). ``hold_seconds``
      интерполяции между отдельными отсчётами (сколько один отсчёт остаётся
      представительным ВПЕРЁД от своего observed_at, пока не появится
      следующий реальный или не истечёт этот интервал) — переиспользует
      freshness.ttl_seconds ниже (не новая, не задокументированная здесь
      константа): это тот же интервал, что уже документирован провайдером
      как ожидаемый шаг между отсчётами (см. cadence выше), только
      применённый ко второй цели. Наблюдение не продлевается за пределы
      hold_seconds без следующего реального отсчёта — main-prompt.md §11
      прямо называет «сохранение последнего наблюдения на весь горизонт»
      наивным базовым методом для сравнения, не тем, что делает эта
      классификация.
    network:
      connect_timeout_seconds: 5.0
      read_timeout_seconds: 10.0
      max_retries: 3
      retry_backoff_base_seconds: 1.0
    freshness:
      # Раз в столько секунд периодический refresh реально идёт в сеть;
      # более частые вызовы fetch_and_store — недорогой no-op (TTL по
      # публикации продукта, main-prompt.md §5). FN-38: то же число служит
      # ``hold_seconds`` классификации (см. classification выше) — единая
      # константа, не дублируется в коде (main-prompt.md §7).
      ttl_seconds: 300
      # Свыше этого возраста последнего успешного получения источник
      # считается критически устаревшим — по нему оценка невозможна, а не
      # «спокойно» (main-prompt.md §2, приёмка FN-22; FN-38:
      # mechanisms[*space_weather].status="stale_data" использует этот же
      # порог через is_critically_stale).
      critical_staleness_seconds: 3600
    enabled: true

