      docs/method.md §3; сырой источник фактов —
      tests/fixtures/sources/archive/README.md.
    published_at: >-
      Поле верхнего уровня ``messageIssueTime`` (точность до минуты),
      сверенное с независимым «## Message Issue Date:» внутри
      ``messageBody`` (секундная точность). При совпадении в пределах
      округления используется более точное значение из тела; при
      существенном расхождении (реальный случай — round 1 ревью PR #18:
