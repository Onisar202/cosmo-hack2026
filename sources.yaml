    published_at: >-
      Строка ':Issued:' внутри тела бюллетеня (тот же принцип, что и у
      noaa-swpc-forecast-discussion-archive выше — не время HTTP-запроса и
      не время слота из URL, которого у этого эндпоинта и нет: у живого
