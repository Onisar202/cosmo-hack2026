  # заголовки, SHA-256) — это и есть «конкретные доказательства» приёмки
  # FN-23, не переизложенные, а проверяемые заново тестами
  # tests/sources/test_archive_publication.py.

  - id: nasa-donki-notifications
    name: "NASA CCMC DONKI — уведомления (Notifications)"
    provider: "NASA Community Coordinated Modeling Center (CCMC), Moon to Mars Space Weather Analysis Office"
    url: "https://api.nasa.gov/DONKI/notifications"
    product: >-
      Текстовые уведомления о зафиксированной или ожидаемой активности
      космопогоды (CME, вспышки, геомагнитные бури, протонные события,
      межпланетные ударные волны и их комбинации/уточнения) — событийный, не
      периодический продукт. Основная линия строгого прогноза из прошлого по
      Механизму 1 (main-prompt.md §11): у каждого уведомления есть
      проверяемое время выпуска. **Важно (round 1 ревью PR #18):** это не
      непрерывный прогнозный продукт с явным горизонтом действия — день без
      уведомлений означает «порог не пересечён», а не «состояние
      подтверждено спокойным»; не заменяет и не «компенсирует» пробел
      noaa-swpc-forecast-discussion-archive ниже как периодического
      продукта, даёт независимую эпизодическую линию предупреждений.
    record_kind: warning
    value_unit: null
    coverage: >-
      Проверено запросом за четыре 15-дневных окна, покрывающих весь
      обязательный период 01.05–30.06.2024 включительно (включая выраженное
      событие 10–11 мая, AR3664, и контрольный период 16–27 июня): 245
      уведомлений, без повторов messageID между окнами, без непрерывного
      молчания длиннее недели. Это доказывает наличие публикаций на
